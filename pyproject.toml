[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-hexcell-developer-agent"
version = "1.0.0"
description = "Zero-Copy 16k-Node HexCell Hyperbolic Memory Swarm Developer Agent for Gemma 4"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Lead 9 Council", email = "aoxendine3@github.com"}
]
dependencies = [
  "numpy>=1.24.0",
  "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0"
]
